# Bộ nhớ đệm ngắn cho trang SEO do backend dựng (giá và tồn kho đổi tối đa sau 60 giây).
proxy_cache_path /var/cache/nginx/seo levels=1 keys_zone=seo:2m max_size=20m inactive=10m use_temp_path=off;

# Backend có thể được tạo lại (đổi IP nội bộ) khi chạy docker compose up -d: dò lại tên "backend" qua DNS của Docker
# thay vì giữ IP lúc nginx khởi động (tránh lỗi 502 sau khi đổi .env).
resolver 127.0.0.11 valid=10s ipv6=off;
upstream backend_api {
  zone backend_api 64k;
  server backend:3001 resolve;
}

server {
  listen 80;
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_vary on;

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  # SEO: backend chèn sẵn title, mô tả, canonical, Open Graph và JSON-LD vào index.html. Lỗi hoặc không có thì trả lại giao diện tĩnh.
  location @spa { rewrite ^ /index.html break; }
  location = / {
    proxy_pass http://backend_api/seo/home;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_intercept_errors on;
    error_page 404 502 503 504 = @spa;
    proxy_cache seo;
    proxy_cache_key $scheme$host$request_uri;
    proxy_cache_valid 200 60s;
    proxy_cache_lock on;
    add_header X-Cache $upstream_cache_status always;
  }
  # Đường dẫn cũ /product/<slug> chuyển vĩnh viễn (301) sang /san-pham/<slug> để không mất link đã chia sẻ hoặc đã lập chỉ mục.
  location ~ ^/product/([a-z0-9-]+)$ { return 301 /san-pham/$1$is_args$args; }
  location ~ ^/san-pham/([a-z0-9-]+)$ {
    proxy_pass http://backend_api/seo/san-pham/$1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_intercept_errors on;
    error_page 404 502 503 504 = @spa;
    proxy_cache seo;
    proxy_cache_key $scheme$host$request_uri;
    proxy_cache_valid 200 60s;
    proxy_cache_lock on;
    add_header X-Cache $upstream_cache_status always;
  }
  location ~ ^/danh-muc/([a-z0-9-]+)$ {
    proxy_pass http://backend_api/seo/danh-muc/$1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_intercept_errors on;
    error_page 404 502 503 504 = @spa;
    proxy_cache seo;
    proxy_cache_key $scheme$host$request_uri;
    proxy_cache_valid 200 60s;
    proxy_cache_lock on;
    add_header X-Cache $upstream_cache_status always;
  }
  location ~ ^/(gioi-thieu|lien-he|chinh-sach-doi-tra|chinh-sach-bao-mat|chinh-sach-van-chuyen)$ {
    proxy_pass http://backend_api/seo/trang/$1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_intercept_errors on;
    error_page 404 502 503 504 = @spa;
    proxy_cache seo;
    proxy_cache_key $scheme$host$request_uri;
    proxy_cache_valid 200 60s;
    proxy_cache_lock on;
    add_header X-Cache $upstream_cache_status always;
  }
  location = /sitemap.xml {
    proxy_pass http://backend_api/seo/sitemap.xml;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_intercept_errors on;
    error_page 404 502 503 504 = @spa;
    proxy_cache seo;
    proxy_cache_key $scheme$host$request_uri;
    proxy_cache_valid 200 60s;
    proxy_cache_lock on;
    add_header X-Cache $upstream_cache_status always;
  }
  location = /robots.txt {
    proxy_pass http://backend_api/seo/robots.txt;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_intercept_errors on;
    error_page 404 502 503 504 = @robots_static;
  }
  location @robots_static { rewrite ^ /robots.txt break; root /usr/share/nginx/html; }

  # Trang riêng tư (giỏ hàng, đơn hàng, quản trị) không được lập chỉ mục: tiêu đề phản hồi + robots.txt + thẻ meta phía giao diện.
  location ~ ^/(checkout|confirmation|track|admin)(/.*)?$ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    try_files /index.html =404;
  }

  location ^~ /api/internal/ { return 404; }
  location = /api/admin/uploads {
    client_max_body_size 6m;
    proxy_pass http://backend_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location ^~ /uploads/ {
    proxy_pass http://backend_api;
  }
  location /api/ {
    proxy_pass http://backend_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /catalog/photos/credits.json {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }
  location ~ ^/catalog/photos/[a-z0-9-]+\.webp$ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
