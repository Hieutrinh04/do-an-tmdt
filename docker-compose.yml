name: long-fish

x-integrations: &integrations
  MOCK_INTEGRATIONS: ${MOCK_INTEGRATIONS:-true}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
  N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-}
  SITE_URL: ${SITE_URL:-http://localhost:8080}

services:
  backend:
    mem_limit: 512m
    logging: &rotating-logs
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    build:
      context: .
      dockerfile: backend/Dockerfile
    init: true
    environment:
      <<: *integrations
      PORT: 3001
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      DATABASE_URL: ${DATABASE_URL:-file:/data/store.db}
      UPLOADS_DIR: /uploads-data
      SEED_DEMO: ${SEED_DEMO:-true}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:8080}
      TRUST_PROXY: 1
      N8N_ORDER_CREATED_WEBHOOK: ${N8N_ORDER_CREATED_WEBHOOK:-http://n8n:5678/webhook/order-created}
      N8N_ORDER_STATUS_WEBHOOK: ${N8N_ORDER_STATUS_WEBHOOK:-http://n8n:5678/webhook/order-status}
      MOCK_DATA_DIR: /data/mock
      SHIPPING_FREE_THRESHOLD: ${SHIPPING_FREE_THRESHOLD:-600000}
      SHIPPING_DEFAULT_FEE: ${SHIPPING_DEFAULT_FEE:-35000}
      SHOP_NAME: ${SHOP_NAME:-Long Fish}
      SHOP_OPEN_DAYS: ${SHOP_OPEN_DAYS:-1,2,3,4,5,6,7}
      SHOP_OPEN_HOUR: ${SHOP_OPEN_HOUR:-8}
      SHOP_CLOSE_HOUR: ${SHOP_CLOSE_HOUR:-21}
      LIVE_FISH_PACKING_FEE: ${LIVE_FISH_PACKING_FEE:-30000}
      LIVE_FISH_PROVINCES_JSON: ${LIVE_FISH_PROVINCES_JSON:-}
      SHIPPING_FEES_JSON: ${SHIPPING_FEES_JSON:-}
      VIETQR_BANK: ${VIETQR_BANK:-}
      VIETQR_ACCOUNT: ${VIETQR_ACCOUNT:-}
      VIETQR_ACCOUNT_NAME: ${VIETQR_ACCOUNT_NAME:-}
      BANK_WEBHOOK_SECRET: ${BANK_WEBHOOK_SECRET:-}
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN:-}
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v23.0}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - store-data:/data
      - uploads-data:/uploads-data
      - integration-keys:/shared
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  frontend:
    mem_limit: 128m
    logging: *rotating-logs
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped

  n8n:
    mem_limit: 768m
    logging: *rotating-logs
    build:
      context: .
      dockerfile: n8n/Dockerfile
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5678/healthz/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30
    environment:
      <<: *integrations
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "1000"
      TZ: Asia/Ho_Chi_Minh
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:5678/}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gemini-2.5-flash-lite}
      GOOGLE_SHEET_ID: ${GOOGLE_SHEET_ID:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_TO: ${MAIL_TO:-}
      # Chỉ dùng lúc khởi động để nạp credential SMTP (start.sh xóa khỏi môi trường trước khi chạy n8n).
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n-data:/home/node/.n8n
      - integration-keys:/shared:ro
      # File Service Account Google (secrets/google-service-account.json, không commit).
      - ./secrets:/secrets:ro
    restart: unless-stopped

volumes:
  store-data:
  uploads-data:
  n8n-data:
  integration-keys:


